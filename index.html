<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <title>AI Video Clipper</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: #0f172a; color: #f1f5f9;
      font-family: system-ui, sans-serif; padding: 16px;
      display: flex; justify-content: center;
    }
    main { width: 100%; max-width: 480px; }
    h1 { font-size: 1.5rem; margin: 8px 0 4px; }
    h2 { font-size: 1.05rem; margin: 0 0 12px; }
    .sub { color: #94a3b8; margin: 0 0 16px; }
    .muted { color: #94a3b8; font-size: 0.85rem; margin-top: 6px; }
    .card {
      background: #111c33; border: 1px solid #1e293b; border-radius: 16px;
      padding: 16px; margin-bottom: 14px;
    }
    .btn, button {
      display: block; width: 100%; padding: 14px; font-size: 1rem; font-weight: 600;
      color: #fff; background: #3b82f6; border: 0; border-radius: 12px;
      text-align: center; text-decoration: none; margin-top: 10px;
    }
    button.ghost { background: #1e293b; color: #e2e8f0; font-size: 0.85rem; padding: 10px; }
    button:disabled { background: #334155; color: #94a3b8; }
    video { width: 100%; max-height: 50vh; border-radius: 12px; background: #000; margin-top: 12px; }
    label.lbl { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 4px; }
    input[type=number] {
      width: 100%; padding: 12px; font-size: 1.1rem; color: #f1f5f9;
      background: #0b1220; border: 1px solid #334155; border-radius: 10px;
    }
    .row { display: flex; gap: 10px; }
    .row > div, .row > button { flex: 1; }
    .bar { height: 10px; background: #1e293b; border-radius: 6px; overflow: hidden; margin: 10px 0 4px; }
    #fill { height: 100%; width: 0%; background: #3b82f6; transition: width 0.2s; }
    #fill.indet { width: 40% !important; animation: slide 1.1s infinite ease-in-out; }
    @keyframes slide { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
    .err { color: #f87171; }
    pre {
      background: #020617; border: 1px solid #1e293b; border-radius: 10px;
      padding: 10px; font-size: 0.75rem; color: #cbd5e1;
      white-space: pre-wrap; word-break: break-word; max-height: 30vh; overflow: auto; margin: 8px 0 0;
    }
  </style>
</head>
<body>
<main>
  <h1>AI Video Clipper</h1>
  <p class="sub">Fase 1B: potong video</p>

  <section class="card">
    <h2>1. Pilih video</h2>
    <label class="btn" for="file">Pilih dari galeri</label>
    <input id="file" type="file" accept="video/*" hidden>
    <div id="fileInfo" class="muted"></div>
    <video id="player" controls playsinline hidden></video>
  </section>

  <section class="card" id="cutCard" hidden>
    <h2>2. Tentukan bagian yang dipotong</h2>
    <div class="row">
      <div>
        <label class="lbl" for="start">Mulai (detik)</label>
        <input id="start" type="number" min="0" step="0.1" inputmode="decimal" value="0">
      </div>
      <div>
        <label class="lbl" for="end">Selesai (detik)</label>
        <input id="end" type="number" min="0" step="0.1" inputmode="decimal" value="10">
      </div>
    </div>
    <div class="row">
      <button class="ghost" id="setStart" type="button">Mulai = posisi video</button>
      <button class="ghost" id="setEnd" type="button">Selesai = posisi video</button>
    </div>
    <div id="lenInfo" class="muted"></div>
    <button id="cut" type="button">Potong video</button>
  </section>

  <section class="card" id="progCard" hidden>
    <div id="stage" style="font-weight:600"></div>
    <div class="bar"><div id="fill" class="indet"></div></div>
    <div id="pct" class="muted"></div>
  </section>

  <section class="card" id="errCard" hidden>
    <h2 class="err">Gagal</h2>
    <pre id="errText"></pre>
    <p class="muted">Video dan pengaturan Anda masih tersimpan. Ketuk "Potong video" untuk mencoba lagi.</p>
  </section>

  <section class="card" id="outCard" hidden>
    <h2>Hasil</h2>
    <video id="outPlayer" controls playsinline></video>
    <a id="dl" class="btn" download>Simpan ke HP</a>
    <div id="outInfo" class="muted"></div>
  </section>
</main>

<script type="module">
  const CDN = "https://cdn.jsdelivr.net/npm";
  const FF_VER = "0.12.10";
  const CORE_VER = "0.12.10";
  const $ = (id) => document.getElementById(id);

  let ffmpeg = null;
  let loading = null;
  let lastLogs = [];
  let currentFile = null;
  let currentURL = null;
  let outURL = null;
  let duration = NaN;
  let busy = false;

  const fmt = (s) => {
    if (!isFinite(s)) return "-";
    const m = Math.floor(s / 60);
    return m + ":" + (s % 60).toFixed(1).padStart(4, "0");
  };
  const extOf = (name) => {
    const m = /\.([a-z0-9]+)$/i.exec(name || "");
    return m ? m[1].toLowerCase() : "mp4";
  };
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  };
  const fileKey = () => currentFile ? currentFile.name + "|" + currentFile.size : "";

  function setStage(t) { $("stage").textContent = t; }
  function setIndeterminate() {
    $("fill").className = "indet";
    $("fill").style.width = "";
    $("pct").textContent = "";
  }
  function setProgress(p) {
    $("fill").className = "";
    $("fill").style.width = (p * 100).toFixed(0) + "%";
    $("pct").textContent = (p * 100).toFixed(0) + "%";
  }
  function withTimeout(promise, ms, msg) {
    return Promise.race([
      promise,
      new Promise((_, rej) => setTimeout(() => rej(new Error(msg)), ms)),
    ]);
  }

  async function download(url, mime, label) {
    const res = await fetch(url);
    if (!res.ok) throw new Error(label + ": HTTP " + res.status);
    const reader = res.body.getReader();
    const chunks = [];
    let got = 0;
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
      got += value.length;
      $("pct").textContent = label + ": " + (got / 1048576).toFixed(1) + " MB";
    }
    return URL.createObjectURL(new Blob(chunks, { type: mime }));
  }

  async function ensureEngine() {
    if (ffmpeg) return ffmpeg;
    if (loading) return loading;
    loading = (async () => {
      setStage("Menyiapkan mesin video...");
      setIndeterminate();
      const { FFmpeg } = await import(CDN + "/@ffmpeg/ffmpeg@" + FF_VER + "/dist/esm/index.js");
      const base = CDN + "/@ffmpeg/core@" + CORE_VER + "/dist/esm";
      const coreURL = await download(base + "/ffmpeg-core.js", "text/javascript", "ffmpeg-core.js");
      const wasmURL = await download(base + "/ffmpeg-core.wasm", "application/wasm", "ffmpeg-core.wasm");
      const workerSrc = CDN + "/@ffmpeg/ffmpeg@" + FF_VER + "/dist/esm/worker.js";
      const classWorkerURL = URL.createObjectURL(
        new Blob(['import "' + workerSrc + '";'], { type: "text/javascript" })
      );
      const ff = new FFmpeg();
      ff.on("log", ({ message }) => {
        lastLogs.push(message);
        if (lastLogs.length > 30) lastLogs.shift();
      });
      ff.on("progress", ({ progress }) => {
        if (progress >= 0 && progress <= 1) setProgress(progress);
      });
      await withTimeout(
        ff.load({ coreURL, wasmURL, classWorkerURL }),
        120000,
        "Waktu habis saat menyalakan mesin (2 menit)"
      );
      ffmpeg = ff;
      return ff;
    })();
    try { return await loading; } finally { loading = null; }
  }

  function updateLenInfo() {
    const s = parseFloat($("start").value);
    const e = parseFloat($("end").value);
    if (isFinite(s) && isFinite(e)) {
      $("lenInfo").textContent =
        "Panjang klip: " + (e - s).toFixed(1) + " detik (" + fmt(s) + " sampai " + fmt(e) + ")" +
        (isFinite(duration) ? " dari total " + fmt(duration) : "");
    }
    store.set("clipper.start", $("start").value);
    store.set("clipper.end", $("end").value);
    store.set("clipper.key", fileKey());
  }

  function showCutCard() {
    $("cutCard").hidden = false;
    if (store.get("clipper.key") === fileKey() && store.get("clipper.end")) {
      $("start").value = store.get("clipper.start") || "0";
      $("end").value = store.get("clipper.end");
    } else {
      $("start").value = "0";
      $("end").value = isFinite(duration) ? Math.min(duration, 30).toFixed(1) : "30";
    }
    updateLenInfo();
  }

  $("file").addEventListener("change", (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    currentFile = f;
    duration = NaN;
    if (currentURL) URL.revokeObjectURL(currentURL);
    currentURL = URL.createObjectURL(f);
    $("errCard").hidden = true;
    $("outCard").hidden = true;
    $("fileInfo").textContent = f.name + " · " + (f.size / 1048576).toFixed(1) + " MB";
    const p = $("player");
    p.hidden = false;
    p.onloadedmetadata = () => { duration = p.duration; showCutCard(); };
    p.onerror = () => {
      $("fileInfo").textContent += " · Pratinjau tidak bisa ditampilkan, isi waktu secara manual.";
      showCutCard();
    };
    p.src = currentURL;
  });

  $("setStart").addEventListener("click", () => {
    $("start").value = $("player").currentTime.toFixed(1);
    updateLenInfo();
  });
  $("setEnd").addEventListener("click", () => {
    $("end").value = $("player").currentTime.toFixed(1);
    updateLenInfo();
  });
  $("start").addEventListener("input", updateLenInfo);
  $("end").addEventListener("input", updateLenInfo);

  function showError(msg) {
    $("progCard").hidden = true;
    $("errCard").hidden = false;
    $("errText").textContent = msg;
  }

  $("cut").addEventListener("click", async () => {
    if (busy || !currentFile) return;
    const start = parseFloat($("start").value);
    const end = parseFloat($("end").value);
    $("errCard").hidden = true;
    $("outCard").hidden = true;

    if (!isFinite(start) || !isFinite(end) || start < 0 || end <= start) {
      showError("Waktu tidak valid. Pastikan 'Selesai' lebih besar dari 'Mulai'.");
      return;
    }
    if (isFinite(duration) && start >= duration) {
      showError("'Mulai' melewati panjang video (" + fmt(duration) + ").");
      return;
    }

    busy = true;
    $("cut").disabled = true;
    $("progCard").hidden = false;
    let ff = null;
    let mounted = false;
    let failure = null;
    const inExt = extOf(currentFile.name);
    const outExt = ["mp4", "mov", "m4v"].includes(inExt) ? "mp4" : inExt;
    const mime = outExt === "mp4" ? "video/mp4" : (currentFile.type || "video/" + outExt);
    const inName = "input." + inExt;
    const outName = "clip." + outExt;

    try {
      ff = await ensureEngine();
      setStage("Membaca video...");
      setIndeterminate();
      const inFile = new File([currentFile], inName, { type: currentFile.type });
      try { await ff.createDir("/in"); } catch (e) {}
      await ff.mount("WORKERFS", { files: [inFile] }, "/in");
      mounted = true;

      setStage("Memotong video...");
      lastLogs.length = 0;
      const code = await ff.exec([
        "-ss", String(start),
        "-i", "/in/" + inName,
        "-t", String(end - start),
        "-c", "copy",
        "-avoid_negative_ts", "make_zero",
        "-movflags", "+faststart",
        outName,
      ], 300000);
      if (code !== 0) {
        throw new Error("Mesin berhenti dengan kode " + code + "\n" + lastLogs.slice(-6).join("\n"));
      }

      setStage("Menyimpan hasil...");
      const data = await ff.readFile(outName);
      if (!data || !data.length) throw new Error("Hasil kosong (0 byte).");
      const blob = new Blob([data], { type: mime });
      try { await ff.deleteFile(outName); } catch (e) {}

      if (outURL) URL.revokeObjectURL(outURL);
      outURL = URL.createObjectURL(blob);
      const base = currentFile.name.replace(/\.[^.]+$/, "").replace(/[^a-z0-9]+/gi, "-").slice(0, 30) || "video";
      $("outPlayer").src = outURL;
      $("dl").href = outURL;
      $("dl").download = "klip-" + base + "-" + Math.round(start) + "s." + outExt;
      $("outInfo").textContent = "Ukuran: " + (blob.size / 1048576).toFixed(2) + " MB. " +
        "Potongan mengikuti titik kunci video, jadi awalnya bisa bergeser beberapa detik.";
      $("progCard").hidden = true;
      $("outCard").hidden = false;
    } catch (e) {
      failure = e;
    } finally {
      if (ff && mounted) { try { await ff.unmount("/in"); } catch (e) {} }
      if (failure) {
        try { if (ffmpeg) ffmpeg.terminate(); } catch (e) {}
        ffmpeg = null;
        showError(failure && failure.message ? failure.message : String(failure));
      }
      busy = false;
      $("cut").disabled = false;
    }
  });
</script>
</body>
</html>
